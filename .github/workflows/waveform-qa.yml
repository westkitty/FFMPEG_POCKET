name: DEX//CUT waveform regression

on:
  pull_request:
    paths:
      - "index.html"
      - "dexcut-waveform.js"
      - "dexcut-waveform.css"
      - "sw.js"
      - "tests/**"
      - ".github/workflows/waveform-qa.yml"

concurrency:
  group: waveform-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Protected implementation and syntax
        run: node tests/dexcut_static_regression.cjs
      - name: Waveform integration invariants
        run: node tests/dexcut_waveform_qa.cjs

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install development-only Chromium test dependencies
        run: |
          npm install --prefix /tmp/dexcut-uiqa --no-audit --no-fund playwright@1.64.0
          /tmp/dexcut-uiqa/node_modules/.bin/playwright install --with-deps chromium
      - name: Install native FFmpeg for QuickTime fixture
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Real MOV to GIF failure-and-retry regression
        env:
          DEXCUT_PLAYWRIGHT: /tmp/dexcut-uiqa/node_modules/playwright
        run: node tests/dexcut_gif_qa.cjs
      - name: Waveform/mobile interaction regression
        env:
          DEXCUT_PLAYWRIGHT: /tmp/dexcut-uiqa/node_modules/playwright
        run: node tests/dexcut_waveform_browser.cjs
      - name: Existing responsive UI regression
        env:
          DEXCUT_PLAYWRIGHT: /tmp/dexcut-uiqa/node_modules/playwright
        run: |
          DEXCUT_BROWSER="$(node -p "require('/tmp/dexcut-uiqa/node_modules/playwright').chromium.executablePath()")" node tests/dexcut_browser_qa.cjs
      - name: FFmpeg result playback, download, and chained editing
        env:
          DEXCUT_PLAYWRIGHT: /tmp/dexcut-uiqa/node_modules/playwright
        run: |
          DEXCUT_BROWSER="$(node -p "require('/tmp/dexcut-uiqa/node_modules/playwright').chromium.executablePath()")" node tests/dexcut_real_flow.cjs
